              <div class="layui-inline">

          <div class="layui-form-item">

    <script>
{#$("#nowSeat").html(parent.data.floor)#}
var x = parent.data.x;
var y = parent.data.y;
var floor = parent.data.floor;
var seat_id;
var obj = parent.data.obj;
                    $.ajax({
                    url: "{% url 'getUserSeatId' %}",
                    type: "post",
                    contentType: 'application/json',
                    dataType: "json",
                    data: JSON.stringify({'x': x, 'y': y, 'floor': floor}),
                    success: function (data) {
                        seat_id = data.info.seat_id;
                    $("#nowSeat").html(seat_id)
                    },
                    error: function (data) {
                    layer.msg('获取座位失败，请重试', {icon: 5});
                    return false;
                    }
                    });



        layui.use(['form','layer'], function(){
            $ = layui.jquery;
          var form = layui.form
          ,layer = layui.layer;
 let data = parent.layer;
          //自定义验证规则
          form.verify({
            nikename: function(value){
              if(value.length < 5){
                return '昵称至少得5个字符啊';
              }
            }
            ,pass: [/(.+){6,12}$/, '密码必须6到12位']
            ,repass: function(value){
                if($('#L_pass').val()!=$('#L_repass').val()){
                    return '两次密码不一致';
                }
            }
          });

          //监听提交
          form.on('submit(add)', function(data){
            //发异步，把数据提交给php
             {#var  name = data.field.name;#}
             {#  var seat_id = data.field.seat_id;#}

              var id = data.field.id;
              var department_id = data.field.department_id;
      var x = parent.data.x;
         var y = parent.data.y;
        {#var  floor = parent.data.floor;#}
        var  event = parent.data.event;
        {#var objj = parent.data.obj;#}
       var func_list = parent.func;
                                 $.ajax({
                                        url: "{% url 'useSeat' %}",
                                        type: "post",
                                        contentType: 'application/json',
                                        dataType: "json",
                                        data:JSON.stringify({'id':id,'seat_id':seat_id,'department_id':department_id}),
                                        success: function (data) {

                                        if (data.obj == 1) {
                                            obj.attr("oncontextmenu", 'getPosOnRightMenu(this,' + x + ',' + y + ',event,' + func_list + ',1)')
                                            {#obj.attr("onmouseout", 'closeMsg()')#}
                                            obj.attr("onmouseover", 'showUsedSeatInfo(this,event,' + x + ',' + y + ')')
                                            obj.html('')
                                            obj.html("<img   src = '/static/images/miniseatHasPerson.png'>");
                                        }
                                                    if (data.obj == 5) {
                                            $(obj).attr("oncontextmenu", 'getPosOnRightMenu(this,' + x + ',' + y + ',event,' + func_list + ',1)')
                                           $(obj).attr("onmouseover", 'showUsedSeatInfo(this,event,' + x + ',' + y + ')')
                                          $(obj).html("<img   src = '/static/images/minimanageseatHasPerson.png'>");

                                        }
                                          if (data.obj == 8) {

                                            $(obj).attr("oncontextmenu", 'getPosOnRightMenu(this,' + x + ',' + y + ',event,' + func_list + ',1)')
                                            {#obj.attr("onmouseout", 'closeMsg()')#}
                                           $(obj).attr("onmouseover", 'showUsedSeatInfo(this,event,' + x + ',' + y + ')')
                                            {#obj.parent().html('')#}
                                           $(obj).html("<img   src = '/static/images/miniofficeseatHasPerson.png'>");
                                        }




                                            layer.msg(data.msg)
                                            var index = parent.layer.getFrameIndex(window.name)
                                              parent.layer.close(index);

                                        },
                                        error: function (data) {
                                        layer.msg(data.responseJSON['msg'], {icon: 5});
                                        return false;
                                        }
                       });





            return false;
          });
{#console.log(parent.data)#}
 {##获取部门信息家在到下拉框#}
         var server = document.getElementById("server"); //server为select定义的id
            var users = document.getElementById("user");
                                $.ajax({
                                url: "{% url 'selectDepartment1' %}",
                                type: "post",
                                contentType: 'application/json',
                                dataType: "json",
                                    data:JSON.stringify({"x":x,"y":y,"floor":floor}),
                                success: function (data) {
                                    var va=data.department;
                                    var user = data.obj;
                                {#layer.msg('新增成功', {icon: 6});#}
                                      for(var i = 0 ; i< va.length ;i++) {
                                                    var option = document.createElement("option");  // 创建添加option属性
                                                    option.setAttribute("value", va[i]['department_id__id']); // 给option的value添加值
                                                    option.innerText = va[i]['department_id__name'];   // 打印option对应的纯文本
                                                    server.appendChild(option);           //给select添加option子标签
                                                }

                                          for(var i = 0 ; i<user.length ;i++) {
                                                    var option = document.createElement("option");  // 创建添加option属性
                                                    option.setAttribute("value", user[i]['id']); // 给option的value添加值
                                                    option.innerText = user[i]['name'];   // 打印option对应的纯文本
                                                    users.appendChild(option);           //给select添加option子标签
                                                }
                                                    form.render("select");            // 刷性select，显示出数据





                                },



                                error: function (data) {
                                layer.msg('获取部门信息失败', {icon: 5});
                                return false;
                                }
               });

        });




    </script>
