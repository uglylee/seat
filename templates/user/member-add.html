<!DOCTYPE html>
<html>
  
  <head>

  <body>
    <div class="x-body layui-anim layui-anim-up">
        <form class="layui-form"  action="add/" method="post">
          <div class="layui-form-item">
              <label for="user_id" class="layui-form-label">
                  <span class="x-red">*</span>工号
              </label>
              <div class="layui-input-inline">
                  <input type="text" id="user_id" name="user_id" required=""
                  autocomplete="off" class="layui-input">
              </div>

          </div>
          <div class="layui-form-item">
              <label for="name" class="layui-form-label">
                  <span class="x-red">*</span>姓名
              </label>
              <div class="layui-input-inline">
{#                  <input type="text" id="L_username" name="username" required="" lay-verify="nikename"#}
                <input type="text" id="name" name="name" required=""
                  autocomplete="off" class="layui-input">
              </div>
          </div>


    <label class="layui-form-label">部门</label>
            <div class="layui-input-inline" style="width:150px;">
                <select name="department_id" id="server" lay-verify="required">
                    <option value="">请选择部门</option>
                 </select>
            </div>





          <div class="layui-form-item">
              <label for="L_repass" class="layui-form-label">
              </label>
              <button  class="layui-btn" lay-filter="add"  lay-submit>
                  增加
              </button>
          </div>
      </form>
    </div>
    <script type="text/javascript" src="/static/js/jquery-3.2.1.min.js"></script>
    <script type="text/javascript" src="/static/lib/layui/layui.js" charset="utf-8"></script>
    <script type="text/javascript" src="/static/js/xadmin.js"></script>
    <script>
        layui.use(['form','layer'], function(){
            $ = layui.jquery;
          var form = layui.form
          ,layer = layui.layer;
        
          //自定义验证规则
          form.verify({
            nikename: function(value){
              if(value.length < 5){
                return '昵称至少得5个字符啊';
              }
            }
            ,pass: [/(.+){6,12}$/, '密码必须6到12位']
            ,repass: function(value){
                if($('#L_pass').val()!=$('#L_repass').val()){
                    return '两次密码不一致';
                }
            }
          });
{#member-list/member-add/add/#}
          //监听提交
          form.on('submit(add)', function(data){
            //发异步，把数据提交

                 var name = data.field['name'];
                  var user_id = data.field['user_id'];
                   var department_id = data.field['department_id'];
{#"department":$("#L_department").val()#}

              $.ajax({
                        url:"{% url 'addUser' %}",
                        type : "POST",
                        contentType: "application/json;charset=utf-8",
                        dataType:"json",
                        data:JSON.stringify({"name":name,"department_id":department_id,"user_id":user_id}),
                        success:function (data) {
                             layer.alert("增加成功", {icon: 6},function () {
                                // 获得frame索引
                                var index = parent.layer.getFrameIndex(window.name);
                                //关闭当前frame
                                parent.layer.close(index);
                                var ind = parent.layer.getChildFrame(window.name);
                                parent.location.reload(ind)
                            });
                              //window.location.go(-1);
                            {#返回上一个页并刷新#}
                {#self.location = document.referrer;#}
                             {#location.reload(true);#}
                        },
                        error:function (data) {
                            layer.alert(data.responseJSON['msg'], {icon: 5},function () {
                // 获得frame索引
                                var index = parent.layer.getFrameIndex(window.name);
                                //关闭当前frame
                                parent.layer.close(index);
                            });
                        }
                    });
                    return false;
              });
        });




  layui.use(['form','layer'], function(){
            $ = layui.jquery;
          var form = layui.form
          ,layer = layui.layer;




              var server = document.getElementById("server"); //server为select定义的id
            {#var users = document.getElementById("user");#}
                                $.ajax({
                                url: "{% url 'selectDepartment' %}",
                                type: "post",
                                contentType: 'application/json',
                                dataType: "json",
                                    {#data:JSON.stringify({"x":x,"y":y,"floor":floor}),#}
                                success: function (data) {
                                    var va=data.department;
                                    {#var user = data.obj;#}
                                {#layer.msg('新增成功', {icon: 6});#}
                                      for(var i = 0 ; i< va.length ;i++) {
                                                    var option = document.createElement("option");  // 创建添加option属性
                                                    option.setAttribute("value", va[i]['id']); // 给option的value添加值
                                                    option.innerText = va[i]['name'];   // 打印option对应的纯文本
                                                    server.appendChild(option);           //给select添加option子标签
                                                }
                                          {##}
                                          {#for(var i = 0 ; i<user.length ;i++) {#}
                                          {#          var option = document.createElement("option");  // 创建添加option属性#}
                                          {#          option.setAttribute("value", user[i]['id']); // 给option的value添加值#}
                                          {#          option.innerText = user[i]['name'];   // 打印option对应的纯文本#}
                                          {#          users.appendChild(option);           //给select添加option子标签#}
                                          {#      }#}
                                                    form.render("select");            // 刷性select，显示出数据





                                },



                                error: function (data) {
                                layer.msg('获取部门信息失败', {icon: 5});
                                return false;
                                }
               });
  })


    </script>
