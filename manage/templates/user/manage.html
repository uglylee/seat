<script type="text/html" id="barDemo">
  <a class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail" >设置分组</a>
{#  <a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>#}

     <script type="text/html" id="barDepartment">

</script>
{#    用户#}
<script>
    var uid;
     var objjjj;

layui.use([ 'laypage', 'layer', 'table',   'element', 'slider','form'], function(){
  var laydate = layui.laydate //日期
  ,laypage = layui.laypage //分页
  ,layer = layui.layer //弹层
  ,table = layui.table //表格
  // ,carousel = layui.carousel //轮播
  ,element = layui.element //元素操作
  ,slider = layui.slider //滑块
      ,form = layui.form;//表单

//搜索
    form.on('submit(sreach)', function(data){
                var searchInfo = data.field['searchInfo'];
                    var table = window.layui.table;
                                          //执行重载
                                          table.reload('user', {
                                            page: {
                                              curr: 1 //重新从第 1 页开始
                                            }
                                            ,where: {
                                              searchInfo : searchInfo
                                            }
                                        });
                return false;
              });

  //监听Tab切换
  element.on('tab(demo)', function(data){
    layer.tips('切换了 '+ data.index +'：'+ this.innerHTML, this, {
      tips: 1
    });
  });

  //执行一个 table 实例
  table.render({
    elem: '#user'
   ,height: 600
      ,limit:15
      ,limits:[5,10,15,20,50,100,200,500,1000,2000,5000]
      ,skin: 'nob' //行边框风格
      ,even: true //开启隔行背景
      ,size: 'sm' //小尺寸的表格
    ,url: '{% url 'getUserInfoList' %}' //数据接口
         ,where:{title:'user'}
    ,title: '用户表'
    ,page: true //开启分页
    ,toolbar: 'default' //开启工具栏，此处显示默认图标，可以自定义模板，详见文档
    {#,totalRow: true //开启合计行#}
    ,cols: [[ //表头
      {#{type: 'checkbox', fixed: 'left'},#}
      {field: 'id', title: 'ID', width:'7%', sort: true, fixed: 'left'}
      ,{field: 'user_id',edit: 'text', title: '工号', width:'13%'}
      ,{field: 'name',edit: 'text', title: '姓名', width:'10%'}
      ,{field: 'department_id__name', title: '部门', width: '20%'}
      ,{field: 'seat_id',edit: 'text', title: '座位号', width:'15%', sort: true}
      ,{field: 'group_id__name', title: '分组', width: '22%', sort: true}
      ,{fixed: 'right',  align:'center', width:'13%',toolbar: '#barDemo'}
    ]]
  });


    //监听单元格编辑
  table.on('edit(test3)', function(obj){
    var value = obj.value //得到修改后的值
    ,data = obj.data //得到所在行所有键值
    ,field = obj.field; //得到字段
    layer.msg('[ID: '+ data.id +'] ' + field + ' 字段更改为：'+ value);
  });

  //监听头工具栏事件
  table.on('toolbar(user)', function(obj){
    var checkStatus = table.checkStatus(obj.config.id)
    ,data = checkStatus.data; //获取选中的数据
    switch(obj.event){
      case 'add':
        {#layer.msg('添加');#}
        {#  layer.msg('添加')#}
           User_show('新增员工 ','{% url 'addUser' %}',500,350)


      break;
      case 'update':
        if(data.length === 0){
          layer.msg('请选择一行');
        } else if(data.length > 1){
          layer.msg('只能同时编辑一个');
        } else {
          {#layer.alert('编辑 [id]：'+ checkStatus.data[0].id);#}
            uid = checkStatus.data[0].id
          User_show('编辑员工 ','{% url 'editUser' %}',500,200)
        }
      break;
      case 'delete':
        if(data.length === 0){
          layer.msg('请选择一行');
        } else {
            var userArray=new Array();
            var idArray = new Array();
            for(var i = 0 ; i <checkStatus.data.length;i++ ){
                userArray[i] = checkStatus.data[i].name;
                idArray[i] = checkStatus.data[i].id;
            }
            layer.confirm('删除员工'+userArray+'?',{btn:['是的,我确定','我再想想']}, function(index){
                       {#checkStatus.del(); //删除对应行（tr）的DOM结构#}
                        layer.close(index);
                
                  $.ajax({
                        url: "{% url 'delUser' %}",
                        type: "post",
                        contentType: 'application/json',
                        dataType: "json",
                        data: JSON.stringify({'id': idArray,'title':'delManyUser'}),
                        success: function (data) {
                        {#layer.msg('删除成功', {});#}
                          var oldData =  table.cache["user"];
                            {#oldData.splice(obj.checkStatus.data('index'),idArray.length);#}
                            layer.msg(data.msg,{time: 30,icon: 6},function(){
                                table.reload('user',{data : oldData});
                            });
                        },
                        error: function (data) {
                        layer.msg(data.responseJSON['msg'], {icon: 5});
                        return false;
                        }
                        });

            })
        }
      break;
    };
  });

  //监听行工具事件
  table.on('tool(user)', function(obj){ //注：tool 是工具条事件名，test 是 table 原始容器的属性 lay-filter="对应的值"
    var data = obj.data //获得当前行数据
        objjjj = obj
    ,layEvent = obj.event; //获得 lay-event 对应的值
      {#任命#}
    if(layEvent === 'detail'){
        {#var user = obj.data.name;#}

       var id = obj.data.id;
        {#console.log(id)#}
        {##表单可选择分组，传id，和group_id#}
        setGroup_show('设置分组','{% url 'setGroup'  %}',400,300)

    }
    {#删除#}
    else if(layEvent === 'del'){
      layer.confirm('删除员工'+obj.data.name+'？',{btn:['是的,我确定','我再想想']}, function(index){

        var id = obj.data.id;
        //向服务端发送删除指令
            $.ajax({
                url: "{% url 'delUser' %}",
                type: "post",
                contentType: 'application/json',
                dataType: "json",
                data: JSON.stringify({'id': id,'title':'delOneUser'}),
                success: function (data) {
                layer.msg(data.msg, {icon: 6});
                obj.del(); //删除对应行（tr）的DOM结构
                layer.close(index);
                },
                error: function (data) {
                layer.msg(data.responseJSON['msg'], {icon: 5});
                return false;
                }
            })


      });
    } else if(layEvent === 'edit'){
      layer.msg('编辑操作');
    }
  });
})
  </script>
    <script>

        function add_Department_show(title,url,w,h){
        if (title == null || title == '') {
            title=false;
        };
        if (url == null || url == '') {
            url="404.html";
        };
        if (w == null || w == '') {
            w=($(window).width()*0.35);
        };
        if (h == null || h == '') {
            h=($(window).height()-300);
        };
        layer.open({
            type: 2,
            area: [w+'px', h +'px'],
            fix: false, //不固定
            maxmin: true,
            shadeClose: true,
            shade:0.4,
            title: title,
            content: url
        });}



        function User_show(title,url,w,h){
        if (title == null || title == '') {
            title=false;
        };
        if (url == null || url == '') {
            url="404.html";
        };
        if (w == null || w == '') {
            w=($(window).width()*0.4);
        };
        if (h == null || h == '') {
            h=($(window).height()-150);
        };
        layer.open({
            type: 2,
            area: [w+'px', h +'px'],
            fix: false, //不固定
            maxmin: true,
            shadeClose: true,
            shade:0.4,
            title: title,
            content: url
        });}


            function setGroup_show(title,url,w,h){
        if (title == null || title == '') {
            title=false;
        };
        if (url == null || url == '') {
            url="404.html";
        };
        if (w == null || w == '') {
            w=($(window).width()*0.4);
        };
        if (h == null || h == '') {
            h=($(window).height()-150);
        };
        layer.open({
            type: 2,
            area: [w+'px', h +'px'],
            fix: false, //不固定
            maxmin: true,
            shadeClose: true,
            shade:0.4,
            title: title,
            data:{   objjj:objjjj,},
            content: url
        });}


        </script>
   </body>
