    <script>
        var obj ;


        function changeGroup(obj,title,id){
            console.log(title,obj,id)
          var   oldValue = $(obj).html();
            console.log(oldValue)
                layer.open({
                id:1,
                    type: 1,
                    title:'编辑%s' %(title),
                    skin:'layui-layer-rim',
                    area:['300px', 'auto'],

                    content: '<br><br><br><div class="layui-form-item">\n' +
                        '    <label class="layui-form-label">'+title+'</label>\n' +
                        '    <div class="layui-input-block">\n' +
                        '      <input id = "changed"  type="text" name="title" autocomplete="off" placeholder="'+oldValue+'" class="layui-input">\n' +
                        '    </div>\n' +
                        '  </div>',
                    btn:['保存','取消'],
                    btn1: function (index,layero) {
                        var value = document.getElementById("changed").value;
                        if (value != '' && value != oldValue){
                                $(obj).html(value);
                                    $.ajax({
                                            url: "{% url 'changeGroup' %}",
                                            type: "post",
                                            contentType: 'application/json',
                                            dataType: "json",
                                            data: JSON.stringify({'title': title, 'value':value,'id':id}),
                                            success: function (data) {
                                                console.log(data);
                                                layer.msg(data.msg);
                                            },
                                            error: function (data) {
                                                console.log(data);
                                                layer.msg(data.msg);
                                            return false;
                                            }
                                            });




                                layer.close(index);
                                return false;
                        }
                        else{
                            layer.close(index);
                        }

                    },
                    btn2:function (index,layero) {
                         layer.close(index);
                    }

                });

        }

       /*用户-停用*/
      function member_stop(obj,id){
          layer.confirm('确认要停用吗？',function(index){

              if($(obj).attr('title')=='启用'){

                //发异步把用户状态进行更改
                $(obj).attr('title','停用')
                $(obj).find('i').html('&#xe62f;');

                $(obj).parents("tr").find(".td-status").find('span').addClass('layui-btn-disabled').html('已停用');
                layer.msg('已停用!',{icon: 5,time:1000});

              }else{
                $(obj).attr('title','启用')
                $(obj).find('i').html('&#xe601;');

                $(obj).parents("tr").find(".td-status").find('span').removeClass('layui-btn-disabled').html('已启用');
                layer.msg('已启用!',{icon: 5,time:1000});
              }
              
          });
      }

      /*用户-删除*/
      function member_del(obj,user,id){
          layer.confirm('确认要删除吗？',function(index){
              //发异步删除数据

              if(user.length == 0){
                     $(obj).parents("tr").remove();


                     $.ajax({
                            url: "{% url 'delGroup' %}",
                            type: "post",
                            contentType: 'application/json',
                            dataType: "json",
                            data: JSON.stringify({'id':id}),
                            success: function (data) {
                            layer.msg('刪除成功', {icon: 6});
                            },
                            error: function (data) {
                            layer.msg('刪除失败', {icon: 5});
                            return false;
                            }
                            });



              {#layer.msg('已删除!');#}
              }
              else{
              layer.msg('请先删除组内用户');
              }

          });
      }

function show(title,url,w,h,objj){
          var tableId = document.getElementById("tableId")

    if (title == null || title == '') {
        title=false;
    };
    if (url == null || url == '') {
        url="404.html";
    };
    if (w == null || w == '') {
        w=($(window).width()*0.5);
    };
    if (h == null || h == '') {
        h=($(window).height()*0.4);
    };


    layer.open({
        type: 2,
        area: [w+'px', h +'px'],
        fix: false, //不固定
        maxmin: true,
        shadeClose: true,
        shade:0.4,
        {#data:{obj:tableId},#}
        title: title,
        content: url,
        end: function () { //最后执行reload
                location.reload();
            }
    });
}

function edit_show(title,url,w,h){
    if (title == null || title == '') {

        url="404.html";
    };
    if (w == null || w == '') {
        w=($(window).width()*0.98);
    };
    if (h == null || h == '') {
        h=($(window).height()-2);
    };
    layer.open({
        type: 2,
        area: [w+'px', h +'px'],
        fix: false, //不固定
        maxmin: true,
        shadeClose: true,
        shade:0.4,
        title: title,
        content: url
    });
}
